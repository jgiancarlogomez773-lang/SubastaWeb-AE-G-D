spring.application.name=subastaweb-backend
server.port=${PORT:8080}

# --- Base de datos (PostgreSQL) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/subastaweb}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Subida de imagen (RN-15: max 3 MB) ---
spring.servlet.multipart.max-file-size=3MB
spring.servlet.multipart.max-request-size=4MB

# --- Sesion por cookie ---
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# --- Aplicacion ---
app.storage.dir=${STORAGE_DIR:./uploads}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}
app.bootstrap-admin.full-name=${ADMIN_FULL_NAME:Administrador}

logging.pattern.level=%5p [%X{requestId:-}]
