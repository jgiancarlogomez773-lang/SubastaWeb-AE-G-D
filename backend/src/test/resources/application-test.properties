spring.datasource.url=jdbc:h2:mem:subastaweb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# Las migraciones reales usan funciones de PostgreSQL; en pruebas Hibernate crea las tablas
# y data.sql siembra las categorías (mismas que la migración V3 del equipo).
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
