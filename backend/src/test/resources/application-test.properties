# Las pruebas usan H2 en memoria: el esquema se genera desde las entidades.
# Las migraciones reales (PostgreSQL) son las de Base de datos y se prueban arrancando contra PostgreSQL.
spring.datasource.url=jdbc:h2:mem:subastaweb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
